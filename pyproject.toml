[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-screen-mcp"
version = "0.1.0"
description = "Local MCP bridge for the AK Screen video editor"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "edgajuman"}]
dependencies = []

[project.scripts]
ak-screen-mcp = "ak_screen_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
